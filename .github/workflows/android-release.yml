name: Build Android APK (Redmi Note 13 - arm64-v8a)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag o versión de release (ej. v6.2.7)'
        required: false
        default: 'v6.2.7'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android arm64-v8a Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: 'true'

      - name: Configure build properties and RAM
        run: |
          # Aumentar memoria para R8 y Kotlin daemon en GitHub Actions
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC/' gradle.properties
          sed -i 's/org.gradle.workers.max=.*/org.gradle.workers.max=4/' gradle.properties
          
          echo "jvm.toolchain.version=21" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "ani.android.abis=arm64-v8a" >> local.properties
          echo "ani.enable.firebase=false" >> local.properties

      - name: Generate Signing Keystore
        id: keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -genkeypair \
            -alias animeko \
            -keypass animeko123 \
            -keystore "$KEYSTORE_PATH" \
            -storepass animeko123 \
            -dname "CN=Animeko, OU=Animeko, O=Animeko, L=Local, S=State, C=US" \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK (arm64-v8a)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:android:assembleDefaultRelease \
            -Pani.android.abis=arm64-v8a \
            -Psigning_release_storeFile="${{ steps.keystore.outputs.keystore_path }}" \
            -Psigning_release_storePassword="animeko123" \
            -Psigning_release_keyAlias="animeko" \
            -Psigning_release_keyPassword="animeko123" \
            "-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            "-Dkotlin.daemon.jvm.options=-Xmx4g" \
            --stacktrace

      - name: Organize APKs for Redmi Note 13
        id: apks
        run: |
          mkdir -p output_apks
          APK_ARM64=$(find app/android/build/outputs/apk/default/release -name "*arm64-v8a-release.apk" | head -n 1)
          if [ -n "$APK_ARM64" ] && [ -f "$APK_ARM64" ]; then
            cp "$APK_ARM64" output_apks/animeko-v6.2.7-redmi-note-13-arm64-v8a.apk
            cp "$APK_ARM64" output_apks/animeko-redmi-note-13-arm64-v8a.apk
          fi
          
          APK_UNIVERSAL=$(find app/android/build/outputs/apk/default/release -name "*universal-release.apk" | head -n 1)
          if [ -n "$APK_UNIVERSAL" ] && [ -f "$APK_UNIVERSAL" ]; then
            cp "$APK_UNIVERSAL" output_apks/animeko-universal-release.apk
          fi
          
          echo "Generated APKs:"
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animeko-redmi-note13-apk
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "val=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "val=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "val=v6.2.7" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: Animeko v6.2.7 para Redmi Note 13 (${{ steps.tag.outputs.val }})
          body: |
            ## Animeko v6.2.7 (Redmi Note 13 / arm64-v8a)
            
            Versión v6.2.7 con optimizaciones críticas en streaming de torrents, filtro estricto de subtítulos en español y multilenguaje latino, corrección de búsqueda de temporadas y purga de fuentes obsoletas.
            
            ### Archivos incluidos:
            - **`animeko-v6.2.7-redmi-note-13-arm64-v8a.apk`**: APK optimizado nativo para Redmi Note 13 (arm64-v8a).
            - **`animeko-redmi-note-13-arm64-v8a.apk`**: Enlace estándar para compatibilidad directa.
            - **`animeko-universal-release.apk`**: APK universal compatible con todas las arquitecturas.
            
            ### Novedades y correcciones (v6.2.7):
            1. **Carga y Reproducción Acelerada de Torrents**:
               - Aumento de la ventana de buffer a 32MB (12 a 64 piezas) y cabecera inicial a 4MB / cola a 2MB para saturar rápidamente el ancho de banda con múltiples sembradores.
               - Asignación de urgencia inmediata (`deadline = 0`) para la pieza solicitada y de salto (seek), eliminando el tiempo de espera al iniciar o avanzar la reproducción.
               - Límite de conexiones ampliado a 500 y peers a 500 en libtorrent.
               - Inclusión de nodos DHT bootstrap adicionales y trackers públicos de alto rendimiento.
            2. **Filtro Potente de Subtítulos en Español y Multilenguaje (Latino)**:
               - Se muestran únicamente enlaces torrent que contienen subtítulos en español (SPA, ESP, LAT, Español, Latino, Castellano) o versiones Multilenguaje con pista en español latino de fansubs reconocidos (SubsPlease, Erai-raws, Judas, ASW, Tsundere-Raws).
               - Priorización de subtítulos en español y español latino al inicio de la lista de fuentes.
            3. **Corrección de Búsqueda y Filtro de Temporadas (Temporada 1)**:
               - Solución al error donde buscar el episodio 1 de animes como Jujutsu Kaisen mostraba el episodio 1 de temporadas posteriores.
               - Normalización con relleno de ceros (`01`, `02`...) en consultas RSS para emparejar lanzamientos individuales con precisión.
               - Algoritmo estricto de filtrado y ordenamiento por temporada que descarta episodios etiquetados con temporadas que no coinciden con la seleccionada.
            4. **Eliminación y Bloqueo de Fuentes JSON**:
               - Se eliminaron y bloquearon las fuentes de suscripción que terminan en `.json` (como `sub.creamycake.org` / `soupcreamycake.org`) de la administración de fuentes y del almacenamiento de la app.
          draft: false
          prerelease: false
          files: |
            output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
