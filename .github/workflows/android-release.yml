name: Build Android APK (Redmi Note 13 - arm64-v8a)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag o versión de release (ej. v6.2.2-es)'
        required: false
        default: 'v6.2.5-es'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android arm64-v8a Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: 'true'

      - name: Configure build properties and RAM
        run: |
          # Aumentar memoria para R8 y Kotlin daemon en GitHub Actions
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8/' gradle.properties
          sed -i 's/kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC/' gradle.properties
          sed -i 's/org.gradle.workers.max=.*/org.gradle.workers.max=4/' gradle.properties
          
          echo "jvm.toolchain.version=21" >> local.properties
          echo "kotlin.native.ignoreDisabledTargets=true" >> local.properties
          echo "ani.android.abis=arm64-v8a" >> local.properties
          echo "ani.enable.firebase=false" >> local.properties

      - name: Generate Signing Keystore
        id: keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          keytool -genkeypair \
            -alias animeko \
            -keypass animeko123 \
            -keystore "$KEYSTORE_PATH" \
            -storepass animeko123 \
            -dname "CN=Animeko, OU=Animeko, O=Animeko, L=Local, S=State, C=US" \
            -validity 10000 \
            -keyalg RSA \
            -keysize 2048
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build Android Release APK (arm64-v8a)
        run: |
          chmod +x ./gradlew
          ./gradlew :app:android:assembleDefaultRelease \
            -Pani.android.abis=arm64-v8a \
            -Psigning_release_storeFile="${{ steps.keystore.outputs.keystore_path }}" \
            -Psigning_release_storePassword="animeko123" \
            -Psigning_release_keyAlias="animeko" \
            -Psigning_release_keyPassword="animeko123" \
            "-Dorg.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8" \
            "-Dkotlin.daemon.jvm.options=-Xmx4g" \
            --stacktrace

      - name: Organize APKs for Redmi Note 13
        id: apks
        run: |
          mkdir -p output_apks
          APK_ARM64=$(find app/android/build/outputs/apk/default/release -name "*arm64-v8a-release.apk" | head -n 1)
          if [ -n "$APK_ARM64" ] && [ -f "$APK_ARM64" ]; then
            cp "$APK_ARM64" output_apks/animeko-v6.2.5-redmi-note-13-arm64-v8a.apk
            cp "$APK_ARM64" output_apks/animeko-redmi-note-13-arm64-v8a.apk
          fi
          
          APK_UNIVERSAL=$(find app/android/build/outputs/apk/default/release -name "*universal-release.apk" | head -n 1)
          if [ -n "$APK_UNIVERSAL" ] && [ -f "$APK_UNIVERSAL" ]; then
            cp "$APK_UNIVERSAL" output_apks/animeko-universal-release.apk
          fi
          
          echo "Generated APKs:"
          ls -lh output_apks/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: animeko-redmi-note13-apk
          path: output_apks/*.apk
          if-no-files-found: error

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "val=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            echo "val=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "val=v6.2.5-es" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.val }}
          name: Animeko v6.2.5 para Redmi Note 13 (${{ steps.tag.outputs.val }})
          body: |
            ## Animeko v6.2.5 (Redmi Note 13 / arm64-v8a)
            
            Solución definitiva al bloqueo de reproducción de torrents ("DecodingData" / pantalla de carga infinita) en Android.
            
            ### Archivos incluidos:
            - **`animeko-v6.2.5-redmi-note-13-arm64-v8a.apk`**: APK optimizado nativo para Redmi Note 13 (arm64-v8a).
            - **`animeko-redmi-note-13-arm64-v8a.apk`**: Enlace estándar para compatibilidad.
            - **`animeko-universal-release.apk`**: APK universal.
            
            ### Correcciones críticas de reproducción de torrents (v6.2.5):
            - **Eliminación del bucle infinito de espera de archivos**: Se resolvió el bloqueo en `resolveDownloadingFile()` que esperaba indefinidamente a que el archivo tuviera tamaño > 0 antes de iniciar el streaming, impidiendo la creación del buffer de lectura y la petición de piezas.
            - **Corrección de deadlines en libtorrent**: Se cambiaron los deadlines negativos (-5000ms/-10000ms que libtorrent descartaba por considerarlos en el pasado) a milisegundos positivos desde el momento actual (500ms para piezas iniciales y 5000ms para el cuerpo), restaurando la descarga prioritaria de las primeras piezas.
            - **Sincronización de memoria compartida IPC**: Se sincronizó el estado de las piezas en el búfer de memoria compartida antes de notificar por IPC al cliente, evitando bloqueos por desincronización entre procesos.
            - **Manejo de reanudación y carreras en `PieceList` y `RemotePieceList`**: Se añadieron comprobaciones seguras contra excepciones por doble reanudación (`Already resumed`) y reintentos para lectura de estado listo.
            - **Corrección de límite de subida en redes móviles**: Se eliminó la restricción agresiva de subida a 1 KB/s que provocaba que los peers de BitTorrent desconectaran la transferencia (choking).
            - **Timeout de 60 segundos en resolución de archivos**: Previene bloqueos eternos si un torrent no responde o los metadatos tardan demasiado.
            - **Priorización de trackers activos y nivelación de tiers**: Se priorizaron trackers ultrarrápidos (OpenTrackr, Nyaa, Stealth, Torrent.eu.org) en el nivel secundario sin interferir con los primarios.
          draft: false
          prerelease: false
          files: |
            output_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
